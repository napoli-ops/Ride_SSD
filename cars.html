<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>All Cars | Ride SSD</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600;800&display=swap');
        
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: #f8fafc;
        }

        .car-card:hover img {
            transform: scale(1.05);
        }

        .glass-nav {
            background: rgba(255, 255, 255, 0.8);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid rgba(0, 0, 0, 0.05);
        }

        .slide {
            animation: fadeIn 0.5s ease-in;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
            }
            to {
                opacity: 1;
            }
        }
    </style>
</head>
<body>

    <nav class="glass-nav sticky top-0 z-50 px-6 py-4 flex justify-between items-center">
        <h1 class="text-2xl font-800 text-blue-600 tracking-tighter"><a href="index.html">Ride SSD</a></h1>
        <div class="hidden md:flex space-x-8 font-semibold text-gray-600">
            <a href="index.html" class="hover:text-blue-600 transition">Home</a>
            <a href="cars.html" class="hover:text-blue-600 transition text-blue-600">Cars</a>
            <a href="#" class="hover:text-blue-600 transition">Booking</a>
            <a href="#" class="hover:text-blue-600 transition">About</a>
            <div class="relative" id="category-menu">
                <a href="#" id="category-link" class="hover:text-blue-600 transition flex items-center cursor-pointer">
                    Category
                    <i class="fas fa-chevron-down ml-1 text-xs"></i>
                </a>
                <div id="category-dropdown" class="hidden absolute top-full left-0 mt-2 bg-white border border-gray-200 rounded-lg shadow-lg z-50 min-w-48">
                    <!-- Categories will be populated here -->
                </div>
            </div>
        </div>
        <button class="bg-blue-600 text-white px-6 py-2 rounded-full font-semibold hover:bg-blue-700 transition">Sign In</button>
    </nav>

    <header class="relative bg-white pt-16 pb-12 px-6 text-center">
        <div class="max-w-4xl mx-auto">
            <h2 class="text-5xl md:text-6xl font-extrabold text-gray-900 mb-6 leading-tight">
                Our Complete <span class="text-blue-600">Fleet</span>
            </h2>
            <p class="text-gray-500 text-lg">Browse all our premium vehicles available for rental</p>
        </div>

        <!-- Vehicle Slideshow -->
        <div class="max-w-6xl mx-auto mt-16 relative">
            <div class="relative bg-gradient-to-r from-blue-600 to-blue-700 rounded-2xl overflow-hidden h-96">
                <div id="slideshow-container" class="relative w-full h-full">
                    <!-- Slides will be populated here -->
                </div>

                <!-- Previous/Next buttons -->
                <button id="prev-slide" class="absolute top-1/2 left-4 -translate-y-1/2 bg-white rounded-full p-3 hover:bg-gray-100 transition z-10 shadow-lg">
                    <i class="fas fa-chevron-left text-blue-600 text-xl"></i>
                </button>
                <button id="next-slide" class="absolute top-1/2 right-4 -translate-y-1/2 bg-white rounded-full p-3 hover:bg-gray-100 transition z-10 shadow-lg">
                    <i class="fas fa-chevron-right text-blue-600 text-xl"></i>
                </button>
            </div>

            <!-- Dots for navigation -->
            <div id="slide-dots" class="flex justify-center gap-2 mt-6">
                <!-- Dots will be populated here -->
            </div>
        </div>
    </header>

    <section class="bg-gray-50 py-20 px-6">
        <div class="max-w-7xl mx-auto">
            <div class="mb-8 flex justify-between items-center">
                <h3 class="text-3xl font-bold text-gray-900">All Vehicles</h3>
                <div class="flex gap-4">
                    <select id="purpose-filter" class="px-4 py-2 bg-white border border-gray-300 rounded-lg font-semibold text-gray-600 hover:bg-gray-50">
                        <option value="">All Purposes</option>
                    </select>
                </div>
            </div>

            <div id="cars-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-8">
            </div>
        </div>
    </section>

    <footer class="bg-gray-900 text-white py-12 px-6">
        <div class="max-w-7xl mx-auto text-center">
            <p>&copy; 2026 Ride SSD. All rights reserved.</p>
        </div>
    </footer>

    <script>
        // Mock Data
        const cars = [
            { id: 1, name: "Tesla Model 3", type: "Electric", purpose: "Business", price: 85, image: "https://images.unsplash.com/photo-1560958089-b8a1929cea89?auto=format&fit=crop&q=80&w=800", transmission: "Auto", seats: 5 },
            { id: 2, name: "Range Rover Sport", type: "SUV", purpose: "Adventure", price: 120, image: "https://images.unsplash.com/photo-1506521781263-d8422e82f27a?auto=format&fit=crop&q=80&w=800", transmission: "Auto", seats: 7 },
            { id: 3, name: "BMW M4 Coupe", type: "Sport", purpose: "Weekend Getaway", price: 150, image: "https://images.unsplash.com/photo-1555215695-3004980ad54e?auto=format&fit=crop&q=80&w=800", transmission: "Manual", seats: 4 },
            { id: 4, name: "Land Cruiser Pickup", type: "SUV", purpose: "Adventure", price: 95, image: "https://images.unsplash.com/photo-1549924231-f129b911e442?auto=format&fit=crop&q=80&w=800", transmission: "Auto", seats: 5 },
            { id: 5, name: "Mercedes-Benz C-Class", type: "Sedan", purpose: "Business", price: 110, image: "https://images.unsplash.com/photo-1502877338535-766e1452684a?auto=format&fit=crop&q=80&w=800", transmission: "Auto", seats: 5 },
            { id: 6, name: "Porsche 911 Carrera", type: "Sport", purpose: "Luxury Experience", price: 200, image: "https://images.unsplash.com/photo-1511919884226-9c1a0e3c8d9b?auto=format&fit=crop&q=80&w=800", transmission: "Manual", seats: 4 }
        ];

        const carsGrid = document.getElementById('cars-grid');
        const purposeFilter = document.getElementById('purpose-filter');

        // Slideshow variables
        let currentSlide = 0;
        const slideshowContainer = document.getElementById('slideshow-container');
        const slideDots = document.getElementById('slide-dots');

        // Populate filter dropdown with unique purposes
        function populateFilter() {
            const purposes = [...new Set(cars.map(car => car.purpose))];
            const filterOptions = purposeFilter.innerHTML;
            purposes.forEach(purpose => {
                const option = document.createElement('option');
                option.value = purpose;
                option.textContent = purpose;
                purposeFilter.appendChild(option);
            });
        }

        // Initialize slideshow
        function initSlideshow() {
            // Create slides
            slideshowContainer.innerHTML = cars.map((car, index) => `
                <div class="slide ${index === 0 ? 'block' : 'hidden'}" data-slide="${index}">
                    <div class="flex items-center justify-between h-full px-8">
                        <div class="flex-1">
                            <h3 class="text-5xl font-bold text-white mb-4">${car.name}</h3>
                            <p class="text-xl text-blue-100 mb-6">${car.purpose}</p>
                            <div class="flex gap-6 mb-8">
                                <div>
                                    <p class="text-blue-200 text-sm mb-1">Type</p>
                                    <p class="text-2xl font-bold text-white">${car.type}</p>
                                </div>
                                <div>
                                    <p class="text-blue-200 text-sm mb-1">Transmission</p>
                                    <p class="text-2xl font-bold text-white">${car.transmission}</p>
                                </div>
                                <div>
                                    <p class="text-blue-200 text-sm mb-1">Seats</p>
                                    <p class="text-2xl font-bold text-white">${car.seats}</p>
                                </div>
                                <div>
                                    <p class="text-blue-200 text-sm mb-1">Price</p>
                                    <p class="text-2xl font-bold text-white">$${car.price}/day</p>
                                </div>
                            </div>
                            <button class="bg-white text-blue-600 px-8 py-3 rounded-lg font-bold hover:bg-gray-100 transition">
                                Book Now
                            </button>
                        </div>
                        <div class="flex-1 flex justify-end">
                            <img src="${car.image}" alt="${car.name}" class="w-full h-80 object-cover rounded-xl">
                        </div>
                    </div>
                </div>
            `).join('');

            // Create dots
            slideDots.innerHTML = cars.map((_, index) => `
                <button class="dot ${index === 0 ? 'bg-blue-600' : 'bg-gray-300'} w-3 h-3 rounded-full transition" data-dot="${index}"></button>
            `).join('');

            // Add event listeners to dots
            document.querySelectorAll('.dot').forEach(dot => {
                dot.addEventListener('click', function() {
                    goToSlide(parseInt(this.getAttribute('data-dot')));
                });
            });

            // Add event listeners to prev/next buttons
            document.getElementById('prev-slide').addEventListener('click', () => prevSlide());
            document.getElementById('next-slide').addEventListener('click', () => nextSlide());

            // Auto-play slideshow
            startAutoPlay();
        }

        function showSlide(n) {
            const slides = document.querySelectorAll('.slide');
            const dots = document.querySelectorAll('.dot');

            if (n >= slides.length) currentSlide = 0;
            if (n < 0) currentSlide = slides.length - 1;

            slides.forEach(slide => slide.classList.add('hidden'));
            slides[currentSlide].classList.remove('hidden');

            dots.forEach(dot => {
                dot.classList.remove('bg-blue-600');
                dot.classList.add('bg-gray-300');
            });
            dots[currentSlide].classList.add('bg-blue-600');
            dots[currentSlide].classList.remove('bg-gray-300');
        }

        function nextSlide() {
            currentSlide++;
            showSlide(currentSlide);
            resetAutoPlay();
        }

        function prevSlide() {
            currentSlide--;
            showSlide(currentSlide);
            resetAutoPlay();
        }

        function goToSlide(n) {
            currentSlide = n;
            showSlide(currentSlide);
            resetAutoPlay();
        }

        let autoPlayInterval;

        function startAutoPlay() {
            autoPlayInterval = setInterval(() => {
                currentSlide++;
                showSlide(currentSlide);
            }, 5000); // Change slide every 5 seconds
        }

        function resetAutoPlay() {
            clearInterval(autoPlayInterval);
            startAutoPlay();
        }


        // Render all cars or filtered cars
        function renderCars(filteredCars = cars) {
            carsGrid.innerHTML = filteredCars.map(car => `
                <div class="car-card bg-white rounded-2xl overflow-hidden border border-gray-100 shadow-sm transition-all duration-300 hover:shadow-xl group">
                    <div class="p-4">
                        <div class="overflow-hidden rounded-xl mb-4">
                            <img src="${car.image}" alt="${car.name}" class="w-full h-48 object-cover transition-transform duration-500">
                        </div>
                        <div class="flex justify-between items-start mb-2">
                            <div>
                                <h4 class="text-xl font-bold text-gray-900">${car.name}</h4>
                                <p class="text-sm text-gray-500 font-semibold uppercase">${car.type}</p>
                            </div>
                            <div class="text-right">
                                <span class="text-xl font-bold text-blue-600">$${car.price}</span>
                                <span class="text-gray-400 text-xs block">/ day</span>
                            </div>
                        </div>
                        <div class="flex justify-between py-4 border-t border-b border-gray-50 my-4 text-gray-500 text-sm">
                            <span><i class="fas fa-cog mr-1"></i> ${car.transmission}</span>
                            <span><i class="fas fa-user-friends mr-1"></i> ${car.seats} Seats</span>
                            <span><i class="fas fa-gas-pump mr-1"></i> Full</span>
                        </div>
                        <div class="mb-3 px-3 py-1 bg-blue-50 rounded-full w-fit">
                            <span class="text-xs font-semibold text-blue-600">${car.purpose}</span>
                        </div>
                        <button class="w-full py-3 rounded-xl bg-blue-600 text-white font-bold hover:bg-blue-700 transition-colors">
                            Book Now
                        </button>
                    </div>
                </div>
            `).join('');
        }

        // Filter cars based on selected purpose
        purposeFilter.addEventListener('change', function() {
            if (this.value === '') {
                renderCars(cars);
            } else {
                const filtered = cars.filter(car => car.purpose === this.value);
                renderCars(filtered);
            }
        });

        // Render category dropdown
        function renderCategoryDropdown() {
            const categories = [...new Set(cars.map(car => car.purpose))];
            const dropdown = document.getElementById('category-dropdown');
            dropdown.innerHTML = categories.map(purpose => `
                <a href="#" class="category-dropdown-item block px-4 py-3 hover:bg-blue-50 transition text-gray-700 hover:text-blue-600">
                    ${purpose}
                </a>
            `).join('');
            
            document.querySelectorAll('.category-dropdown-item').forEach(item => {
                item.addEventListener('click', function(e) {
                    e.preventDefault();
                    const selectedPurpose = this.textContent.trim();
                    purposeFilter.value = selectedPurpose;
                    purposeFilter.dispatchEvent(new Event('change'));
                    document.getElementById('category-dropdown').classList.add('hidden');
                });
            });
        }

        // Toggle dropdown on category link
        const categoryMenu = document.getElementById('category-menu');
        const categoryLink = document.getElementById('category-link');
        const categoryDropdown = document.getElementById('category-dropdown');

        categoryLink.addEventListener('click', function(e) {
            e.preventDefault();
            categoryDropdown.classList.toggle('hidden');
        });

        categoryMenu.addEventListener('mouseenter', function() {
            categoryDropdown.classList.remove('hidden');
        });

        categoryMenu.addEventListener('mouseleave', function() {
            categoryDropdown.classList.add('hidden');
        });

        // Initialize
        populateFilter();
        renderCars();
        renderCategoryDropdown();
        initSlideshow();
    </script>
</body>
</html>
